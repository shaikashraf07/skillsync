name: 📱 Build SkillSync Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 🤖 Build Android APK (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build Frontend Web Bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://skillsync-api-gnhz.onrender.com
        run: npm run build

      - name: ⚡ Sync Capacitor Android Assets
        working-directory: frontend
        run: npx cap sync android

      - name: 🔨 Grant Execute Permission to Gradle Wrapper
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: 🤖 Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillSync-Android-App-Debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: 📝 Publish GitHub Actions Summary
        if: always()
        run: |
          echo "## 📱 SkillSync Android APK Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package Name | \`com.skillsync.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Application Name | SkillSync Mobile |" >> $GITHUB_STEP_SUMMARY
          echo "| Target API | Android API 34 (Android 14) |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | \`https://skillsync-api-gnhz.onrender.com\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📥 Download your ready-to-install **\`SkillSync-Android-App-Debug.apk\`** file from the Actions Artifacts section above!" >> $GITHUB_STEP_SUMMARY
