name: API Load Testing (k6)

on:
  push:
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend Target URL'
        required: false
        default: 'https://skillsync-api-gnhz.onrender.com'

jobs:
  load-test:
    name: Run k6 Baseline Load Test (100 VUs / 1 min)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://skillsync-api-gnhz.onrender.com' }}
        run: |
          k6 run --summary-export=summary.json backend/node-service/scripts/load-test.js

      - name: Parse & Publish Load Test Summary
        if: always()
        run: |
          node backend/node-service/scripts/parseK6Summary.js summary.json
