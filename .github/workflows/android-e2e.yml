name: Android Appium Mobile E2E Testing

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  appium-test:
    name: Appium E2E Tests (Android Emulator) (29, default, x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Dependencies
        run: |
          cd SkillSyncAppium
          npm install

      - name: Execute Appium 800 E2E Test Suite & Generate Excel/HTML Reports
        run: |
          cd SkillSyncAppium
          mkdir -p reports
          node scripts/run_appium_tests.js | tee reports/test-output.log

      - name: Upload Excel Analysis Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-analysis-report
          if-no-files-found: ignore
          path: |
            SkillSync_Appium_Mobile_E2E_Report.xlsx
            SkillSyncAppium/reports/appium-test-report.xlsx

      - name: Upload HTML Execution Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-pytest-report
          if-no-files-found: ignore
          path: SkillSyncAppium/reports/execution-report.html

      - name: Upload Test Output Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          if-no-files-found: ignore
          path: SkillSyncAppium/reports/test-output.log



