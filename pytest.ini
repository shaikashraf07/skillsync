[pytest]
testpaths = automation/tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --no-header -p no:cacheprovider
markers =
    authentication: Authentication test cases (TC001-TC040)
    navigation: Navigation test cases (TC041-TC070)
    ui: UI validation test cases (TC071-TC120)
    forms: Forms test cases (TC121-TC170)
    crud: CRUD test cases (TC171-TC220)
    validation: Input validation test cases (TC221-TC260)
    error_handling: Error handling test cases (TC261-TC280)
    regression: Regression test cases (TC281-TC300)
